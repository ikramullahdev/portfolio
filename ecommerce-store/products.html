<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | NovaShop</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <h2>NovaShop</h2>
        </div>

        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <div class="icons">

            <i class="fas fa-search"></i>

            <a href="wishlist.html">
                <i class="fas fa-heart"></i>
            </a>

            <div class="cart-icon">
                <a href="cart.html">
                    <i class="fas fa-shopping-cart"></i>
                </a>
                <span id="cart-count">0</span>
            </div>

        </div>

    </header>

    <!-- Products Section -->
    <section class="products-page">

        <h1>Our Products</h1>

        <!-- Search Box -->
        <input
            type="text"
            id="search"
            placeholder="Search Products...">

        <!-- Sort Dropdown -->
        <div class="sort-container">
            <select id="sort">
                <option value="default">Sort By</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="name">Name (A-Z)</option>
            </select>
        </div>

        <div class="category-container">

    <button class="category-btn" data-category="all">
        All
    </button>

    <button class="category-btn" data-category="Electronics">
        Electronics
    </button>

    <button class="category-btn" data-category="Gaming">
        Gaming
    </button>

    <button class="category-btn" data-category="Accessories">
        Accessories
    </button>

</div>

        <!-- Products -->
        <div class="products-container" id="products">

        </div>

    </section>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        ✅ Product added to cart
    </div>

    <!-- JavaScript -->
    <script src="js/products.js"></script>

</body>

</html>
