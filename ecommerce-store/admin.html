<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | NovaShop</title>


<link rel="stylesheet" href="css/style.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>



<script>

if(localStorage.getItem("adminLogin") !== "true"){

    window.location.href="admin-login.html";

}

</script>



<body>


<header class="header">


<div class="logo">

<h2>
NovaShop Admin
</h2>

</div>



<nav>

<ul class="nav-links">


<li>
<a href="index.html">
Store
</a>
</li>



<li>
<a href="orders.html">
Orders
</a>
</li>



<li>
<a href="#" onclick="logout()">
Logout
</a>
</li>


</ul>

</nav>


</header>





<section class="products-page">


<h1>
Admin Dashboard
</h1>




<!-- ANALYTICS -->


<div class="dashboard-cards">


<div class="admin-card">

<h2 id="total-orders">
0
</h2>

<p>
Total Orders
</p>

</div>



<div class="admin-card">

<h2 id="total-revenue">
$0
</h2>

<p>
Total Revenue
</p>

</div>




<div class="admin-card">

<h2 id="total-products">
0
</h2>

<p>
Total Products
</p>

</div>




<div class="admin-card">

<h2 id="total-customers">
0
</h2>

<p>
Customers
</p>

</div>


</div>






<!-- PRODUCT MANAGEMENT -->


<div class="product-management">


<h2>
Manage Products
</h2>



<input 
type="text"
id="product-name"
placeholder="Product Name">



<input 
type="number"
id="product-price"
placeholder="Product Price">



<label>
Product Image
</label>


<input 
type="file"
id="product-image"
accept="image/*">


<img 
id="image-preview"
src=""
style="width:120px; margin-top:15px; display:none;">



<input 
type="text"
id="product-category"
placeholder="Category">



<button id="add-product-btn">

Add Product

</button>

<button id="update-product-btn" style="display:none;">

Update Product

</button>
</div>





<!-- ADMIN PRODUCTS LIST -->


<div id="admin-products">


</div>







<!-- ORDERS -->


<h2 style="margin-top:50px;">
Manage Orders
</h2>



<div id="admin-orders">


</div>



</section>






<script src="js/admin.js"></script>


</body>

</html>
