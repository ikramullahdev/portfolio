<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>📝 To-Do List</h1>

        <div class="input-box">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button id="addBtn">
                Add
            </button>
        </div>

        <!-- Task Counter -->
        <div class="task-info">
            <span id="taskCounter">Total: 0</span>
        </div>

        <!-- Filters -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="pending">
                Pending
            </button>

            <button class="filter-btn" data-filter="completed">
                Completed
            </button>
        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Bottom Buttons -->
        <div class="bottom-actions">
            <button id="clearCompleted">
                Clear Completed
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
