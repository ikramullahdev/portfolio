<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<h1>🌤 Weather App</h1>

<div class="search-box">

<input type="text" placeholder="Enter City">

</div>

<div class="weather">

<h2>Islamabad</h2>

<h1>30°C</h1>

<p>Clear Sky ☀️</p>

<div class="details">

<div>

<h3>Humidity</h3>

<p>60%</p>

</div>

<div>

<h3>Wind</h3>

<p>12 km/h</p>

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
