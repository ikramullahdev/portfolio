<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div class="header">
        <h1>💰 Expense Tracker</h1>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle Dark Mode">🌙</button>
    </div>

    <div class="balance-box">
        <h3>Your Balance</h3>
        <h2 id="balance">$0</h2>
    </div>

    <div class="income-expense">
        <div class="box income">
            <h3>📈 Income</h3>
            <p id="income">$0</p>
        </div>

        <div class="box expense">
            <h3>📉 Expense</h3>
            <p id="expense">$0</p>
        </div>
    </div>

    <div class="form-section">
        <h3>Add Transaction</h3>
        
        <input 
            type="text" 
            id="text" 
            placeholder="Transaction Name">

        <select id="category">
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚗 Transport</option>
            <option value="Entertainment">🎬 Entertainment</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Utilities">💡 Utilities</option>
            <option value="Salary">💼 Salary</option>
            <option value="Healthcare">🏥 Healthcare</option>
            <option value="Other">📌 Other</option>
        </select>

        <input 
            type="number" 
            id="amount" 
            placeholder="Amount">

        <input 
            type="date" 
            id="date">

        <div class="button-group">
            <button onclick="addTransaction()" class="add-btn">
                ➕ Add Transaction
            </button>
            <button onclick="clearAll()" class="clear-btn">
                🗑️ Clear All
            </button>
        </div>
    </div>

    <div class="filter-section">
        <h3>Filter</h3>
        <select id="filterCategory" onchange="filterTransactions()">
            <option value="">All Categories</option>
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚗 Transport</option>
            <option value="Entertainment">🎬 Entertainment</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Utilities">💡 Utilities</option>
            <option value="Salary">💼 Salary</option>
            <option value="Healthcare">🏥 Healthcare</option>
            <option value="Other">📌 Other</option>
        </select>
    </div>

    <h3>History</h3>

    <ul id="list"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
